name: Ruff

on: pull_request

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.4"
          args: check --select E,F,W --output-format=github
          src: "Day01 Day02 Day03 Day04 tests"
